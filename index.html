<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <title>iiko Office</title>
  <link rel="icon" type="image/svg+xml" href="./assets/app-icon.svg?v=56">
  <link rel="apple-touch-icon" href="./assets/app-icon.svg?v=56">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css?v=57">
</head>
<body>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>

  <aside id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="side-menu__header">
      <div>
        <div class="side-menu__eyebrow">iiko Office</div>
        <strong>Разделы</strong>
      </div>
      <button id="closeMenuBtn" class="icon-button" type="button" aria-label="Закрыть меню">×</button>
    </div>

    <nav class="side-menu__nav" aria-label="Разделы приложения">
      <button class="menu-item active" type="button" data-tab="balances">
        <span class="menu-item__icon">▦</span>
        <span>Остатки</span>
      </button>
      <button class="menu-item" type="button" data-tab="documents">
        <span class="menu-item__icon">▤</span>
        <span>Документы</span>
      </button>
      <button class="menu-item" type="button" data-tab="inventories">
        <span class="menu-item__icon">✓</span>
        <span>Инвентаризации</span>
      </button>
      <button class="menu-item" type="button" data-tab="dishes">
        <span class="menu-item__icon">◫</span>
        <span>Номенклатура</span>
      </button>
      <button class="menu-item" type="button" data-tab="turnover">
        <span class="menu-item__icon">▥</span>
        <span>ОСВ</span>
      </button>
    </nav>
  </aside>

  <header class="app-header">
    <button id="menuBtn" class="menu-button" type="button" aria-label="Открыть меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="brand">
      <div class="brand__mark"><img src="./assets/logo.svg?v=57" alt=""></div>
      <div class="brand__text">
        <h1 id="pageTitle">iiko Office</h1>
        <p id="connectionStatus">Подключение…</p>
      </div>
    </div>

    <button id="refreshBtn" class="refresh-button" type="button">
      <span class="refresh-button__icon">↻</span>
      <span class="refresh-button__text">Обновить</span>
    </button>
  </header>

  <main class="app-main">
    <section id="balanceControls" class="controls-panel">
      <div class="controls-row">
        <label class="field field--store">
          <span class="field__label">Склад</span>
          <select id="storeFilter">
            <option>Загрузка складов…</option>
          </select>
        </label>

        <label class="search-field">
          <span class="search-field__icon">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Товар или артикул">
        </label>
      </div>

      <div id="balanceFilterChips" class="filter-chips" role="group" aria-label="Фильтр остатков">
        <button class="filter-chip active" type="button" data-balance-filter="all">Все</button>
        <button class="filter-chip" type="button" data-balance-filter="stock">Только с остатком</button>
        <button class="filter-chip filter-chip--danger" type="button" data-balance-filter="negative">Отрицательные</button>
      </div>
    </section>

    <section id="periodControls" class="period-panel" hidden>
      <label class="field">
        <span class="field__label">С даты</span>
        <input id="dateFrom" type="date">
      </label>
      <label class="field">
        <span class="field__label">По дату</span>
        <input id="dateTo" type="date">
      </label>
    </section>

    <section id="summary" class="summary-grid" aria-live="polite"></section>

    <section id="content" class="content-panel">
      <div class="loading">Получаем живые остатки из iikoServer…</div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="./config.js?v=57"></script>
  <script type="module" src="./app.js?v=57"></script>
</body>
</html>
