<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>iiko Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>iiko Склад</h1>
      <p id="connectionStatus" class="muted">Подготовка…</p>
    </div>
    <button id="refreshBtn" class="primary">Обновить</button>
  </header>

  <main>
    <section class="filters card">
      <label>Склад<select id="storeFilter"><option value="">Все склады</option></select></label>
      <label>Поиск<input id="searchInput" type="search" placeholder="Товар, документ, блюдо" /></label>
      <label>С даты<input id="dateFrom" type="date" /></label>
      <label>По дату<input id="dateTo" type="date" /></label>
    </section>

    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-tab="balances">Остатки</button>
      <button class="tab" data-tab="documents">Документы</button>
      <button class="tab" data-tab="inventories">Инвентаризации</button>
      <button class="tab" data-tab="dishes">Блюда</button>
      <button class="tab" data-tab="turnover">ОСВ</button>
    </nav>

    <section id="summary" class="summary-grid"></section>
    <section id="content" class="card table-card"></section>
  </main>

  <dialog id="detailsDialog">
    <form method="dialog"><button class="close" aria-label="Закрыть">×</button></form>
    <div id="detailsContent"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
